# Dataset choice: "DROZY" or "SEED-VIG"
dataset: "SEED-VIG"

# Output folder name (will be created under config.OUTPUT_DIR for batch generation)
output_folder: "seedvig_scalograms"

# Dataset split selection (Batch Mode)
subjects: [1, 3]
channels: ["FT8", "T7"]

# Whether to generate and save biomarkers / extra features (Batch Mode)
extra_input: true

# Parameters for scalogram generation (used in both Batch and Simple modes)
scalogram_params:
  freq_min: 3
  freq_max: 30
  epoch_duration: 8.0
  wavelet_type: "morl"
  cmap: "gray"
  final_width_px: 64
  final_height_px: 64

# Configuration for Simple Mode (single image plot/test)
simple_params:
  subject: 1
  channel: "O1"
  epoch_index: 10
  show_bands: true
  width_px: 662        # Initial scalogram width
  height_px: 536       # Initial scalogram height
  dpi: 100
  final_width_px: 256  # Override resolution for high-res visualization
  final_height_px: 256
