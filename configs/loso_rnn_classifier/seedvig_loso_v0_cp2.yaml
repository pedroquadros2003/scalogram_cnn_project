# ==============================================================================
# SEED-VIG Leave-One-Subject-Out (LOSO) Classifier Configuration
# Architecture: v0 (Standard MLP Head) coupled with Pretrained RNN Forecaster
# ==============================================================================

dataset_type: "seed_vig"
channel: "CP2"
model_version: "v0"
rnn_model_path: "outputs/models/best_rnn_predictor_seedvig_CP2.h5"

# Anticipation lead time (target state X seconds ahead)
lead_time_sec: 30.0
stride_sec: 5.0
resample_freq: 100.0

# MLP Training Parameters
epochs: 15
batch_size: 64
learning_rate: 0.001
optimizer_name: "adam"
hidden_units_1: 64
hidden_units_2: 32
dropout_1: 0.3
dropout_2: 0.2

# Loss Weighting
class_weight_mode: "none"
drowsiness_threshold: 0.5
fine_tune_rnn: false

# Plotting
save_plot: true
