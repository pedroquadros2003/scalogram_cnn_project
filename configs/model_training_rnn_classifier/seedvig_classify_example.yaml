# Dataset configuration
dataset_type: "seed_vig"
channel: "CP2"
subjects: [1, 2, 3]

# Signal window configurations
# Input window is automatically inferred from forecaster model (1.0s / 100 samples)
lead_time_sec: 30.0    # Anticipatory early warning target at t + 30.0s
stride_sec: 5.0        # Window sliding stride in seconds
resample_freq: 100.0   # Frequency matching pre-trained forecaster (100 Hz)

# Pre-trained RNN forecaster model path
rnn_model_path: "outputs/models/best_rnn_predictor_seedvig_CP2.h5"

# MLP Training hyperparameters
model_version: "v0"
epochs: 15
batch_size: 32
learning_rate: 0.001
train_split: 0.8
drowsiness_threshold: 0.5

# Class weighting mode ("balanced", "none", or custom drowsy_weight)
class_weight_mode: "balanced"

# Output coupled model path
output_model: null
