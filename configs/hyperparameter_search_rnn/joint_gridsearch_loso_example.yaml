# ==============================================================================
# Joint Multi-Task Grid Search Configuration: Signal Forecasting + Classification
# Validation Strategy: Leave-One-Subject-Out (LOSO) Cross-Validation
# ==============================================================================

MODEL_HYPER_PARAMS:
  predict_version:
    mode: "choice"
    values: ["v0", "v1"]              # LSTM (v0) vs GRU (v1)

  classifier_version:
    mode: "choice"
    values: ["v0", "v1"]              # Standard MLP (v0) vs BN-MLP (v1)

  loss_alpha:
    mode: "choice"
    values: [0.3, 0.5, 0.7]           # Loss balance weight alpha

  latent_dim:
    mode: "fixed"
    values: [32]

  learning_rate:
    mode: "fixed"
    values: [0.001]

  hidden_units_1:
    mode: "fixed"
    values: [64]

  hidden_units_2:
    mode: "fixed"
    values: [32]

  dropout_1:
    mode: "fixed"
    values: [0.3]

  dropout_2:
    mode: "fixed"
    values: [0.2]

  optimizer_name:
    mode: "fixed"
    values: ["adam"]

MODEL_TRAIN_PARAMS:
  dataset_type:
    mode: "fixed"
    values: ["seed_vig"]

  channel:
    mode: "fixed"
    values: ["CP2"]

  lead_time_sec:
    mode: "choice"
    values: [0.0, 5.0, 30.0]          # Immediate vs 5s vs 30s anticipatory detection

  forecast_steps:
    mode: "fixed"
    values: [1]

  input_sec:
    mode: "fixed"
    values: [1.0]

  stride_sec:
    mode: "fixed"
    values: [5.0]

  epochs:
    mode: "fixed"
    values: [15]

  batch_size:
    mode: "fixed"
    values: [32]

  drowsiness_threshold:
    mode: "fixed"
    values: [0.5]

  # List of validation subject IDs to evaluate in each LOSO fold
  subjects:
    mode: "fixed"
    values:
      - [1, 2, 3]
