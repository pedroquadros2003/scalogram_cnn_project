# ==============================================================================
# Joint Multi-Task Grid Search: Clean 4D Spatial EEG Fusion (CP1 Bilateral Central)
# Validation Strategy: Leave-One-Subject-Out (LOSO) Cross-Validation
#
# Multi-Channel Spatial Configuration:
#   Channels: ['CP2', 'CP1', 'FT7', 'P2']
#     - CP2: Centro-parietal right (sensorimotor control & motor readiness)
#     - CP1: Centro-parietal left (sensorimotor control, symmetrical bilateral pair with CP2)
#     - FT7: Fronto-temporal left (anterior blink dynamics & frontal theta)
#     - P2:  Parietal right (spatial parietal dynamics & attentional allocation)
#
# Note on SEED-VIG Montage:
#   CP1 is the direct symmetrical bilateral counterpart to CP2 and the most central
#   coronal channel available in SEED-VIG, completely free from posterior headrest contact.
#
# Individual Baseline Calibration:
#   baseline_sec: 120.0s
#
# Cleanest Top-5 Subjects:
#   [2, 4, 5, 14, 18]
# ==============================================================================

MODEL_HYPER_PARAMS:

  predict_version:
    mode: "choice"
    values: ["v0", "v1"]              # LSTM (v0) vs GRU (v1)

  classifier_version:
    mode: "fixed"
    values: ["v1"]                    # BN-MLP coupled head

  loss_alpha:
    mode: "choice"
    values: [0.5, 0.7]

  latent_dim:
    mode: "fixed"
    values: [32]

  learning_rate:
    mode: "fixed"
    values: [0.001]

  hidden_units_1:
    mode: "fixed"
    values: [64]

  hidden_units_2:
    mode: "fixed"
    values: [32]

  dropout_1:
    mode: "fixed"
    values: [0.3]

  dropout_2:
    mode: "fixed"
    values: [0.2]

  optimizer_name:
    mode: "fixed"
    values: ["adam"]

MODEL_TRAIN_PARAMS:
  dataset_type:
    mode: "fixed"
    values: ["seed_vig"]

  channels:
    mode: "fixed"
    values:
      - ["CP2", "CP1", "FT7", "P2"]

  lead_time_sec:
    mode: "choice"
    values: [0.0, 5.0, 30.0]

  forecast_steps:
    mode: "fixed"
    values: [1]

  input_sec:
    mode: "fixed"
    values: [1.0]

  stride_sec:
    mode: "fixed"
    values: [5.0]

  epochs:
    mode: "fixed"
    values: [15]

  batch_size:
    mode: "fixed"
    values: [64]

  drowsiness_threshold:
    mode: "fixed"
    values: [0.5]

  baseline_sec:
    mode: "fixed"
    values: [120.0]

  subjects:
    mode: "fixed"
    values:
      - [2, 4, 5, 14, 18]
