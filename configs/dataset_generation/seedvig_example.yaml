# Dataset choice: "DROZY" or "SEED-VIG"
dataset: "SEED-VIG"

# Output folder name (will be created under config.OUTPUT_DIR for batch generation)
output_folder: "seedvig_scalograms"

# Dataset split selection (Batch Mode)
subjects: [1, 3]
channels: ["FT8", "T7"]

# Whether to generate and save biomarkers / extra features (Batch Mode)
extra_input: true

# Parameters for scalogram generation (used in both Batch and Simple modes)
scalogram_params:
  freq_min: 3
  freq_max: 30
  epoch_duration: 8.0
  wavelet_type: "morl"
  cmap: "gray"
  final_width_px: 64
  final_height_px: 64
